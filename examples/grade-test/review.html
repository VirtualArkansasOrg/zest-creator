<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Grade Test - Teacher Review</title>
  <script src="/public/zest-bridge.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      padding: 24px;
      background: #f8f9fa;
      color: #2d3b45;
    }
    .card {
      background: white;
      border-radius: 12px;
      padding: 24px;
      margin-bottom: 16px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.08);
    }
    h1 { font-size: 20px; margin-bottom: 8px; color: #0770A2; }
    h2 { font-size: 16px; margin-bottom: 12px; color: #394B58; }
    .subtitle { font-size: 13px; color: #888; margin-bottom: 16px; }

    .score-display {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 16px;
    }
    .score-circle {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      font-weight: 700;
      color: white;
    }
    .score-circle.high { background: #28a745; }
    .score-circle.mid { background: #ffc107; color: #333; }
    .score-circle.low { background: #dc3545; }
    .score-details { font-size: 14px; line-height: 1.8; }
    .score-details strong { color: #2d3b45; }

    .answers-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 14px;
    }
    .answers-table th {
      background: #f0f7fb;
      text-align: left;
      padding: 10px 12px;
      font-weight: 600;
      border-bottom: 2px solid #ddd;
    }
    .answers-table td {
      padding: 10px 12px;
      border-bottom: 1px solid #eee;
    }
    .correct { color: #28a745; font-weight: 600; }
    .incorrect { color: #dc3545; font-weight: 600; }

    .no-data {
      text-align: center;
      padding: 40px;
      color: #888;
      font-size: 15px;
    }

    .debug { font-family: monospace; font-size: 12px; background: #f1f1f1; padding: 12px; border-radius: 6px; white-space: pre-wrap; max-height: 200px; overflow-y: auto; margin-top: 8px; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Student Submission Review</h1>
    <p class="subtitle">SpeedGrader view — showing the student's quiz results</p>
  </div>

  <div id="content" class="no-data">
    <p>Loading submission data...</p>
  </div>

  <div class="card">
    <h2>Debug</h2>
    <div id="debug" class="debug">Initializing review mode...</div>
  </div>

  <script>
    (function() {
      'use strict';

      var contentEl = document.getElementById('content');
      var debugEl = document.getElementById('debug');

      var questionLabels = {
        q1: 'What does LTI stand for?',
        q2: 'What format does AGS use for grade passback?',
        q3: 'Which protocol does LTI 1.3 use for authentication?'
      };
      var optionLabels = {
        q1: { a: 'Learning Tools Integration', b: 'Learning Tools Interoperability', c: 'Linked Teaching Interface' },
        q2: { a: 'XML', b: 'JSON', c: 'CSV' },
        q3: { a: 'OAuth 1.0', b: 'SAML', c: 'OpenID Connect' }
      };

      function log(msg) {
        var ts = new Date().toLocaleTimeString();
        debugEl.textContent += '\n[' + ts + '] ' + msg;
        debugEl.scrollTop = debugEl.scrollHeight;
      }

      log('Review mode: ' + Zest.isReviewMode());

      Zest.onReady(function(ctx) {
        log('Context received: ' + JSON.stringify(ctx));
        log('isReviewMode: ' + Zest.isReviewMode());

        var submission = Zest.getSubmission();
        log('Submission data: ' + JSON.stringify(submission));

        if (!submission) {
          contentEl.innerHTML = '<div class="no-data"><p>No submission data available for this student.</p></div>';
          return;
        }

        var artifacts = submission.artifacts || {};
        var pct = submission.score || 0;
        var scoreClass = pct >= 80 ? 'high' : pct >= 50 ? 'mid' : 'low';

        var html = '<div class="card">';
        html += '<h2>Score</h2>';
        html += '<div class="score-display">';
        html += '<div class="score-circle ' + scoreClass + '">' + pct + '%</div>';
        html += '<div class="score-details">';
        html += '<p><strong>Raw Score:</strong> ' + (artifacts.score || '?') + ' / ' + (artifacts.total || '?') + '</p>';
        html += '<p><strong>Submitted:</strong> ' + (submission.submittedAt ? new Date(submission.submittedAt).toLocaleString() : 'Unknown') + '</p>';
        if (submission.userName) {
          html += '<p><strong>Student:</strong> ' + submission.userName + '</p>';
        }
        if (submission.comment) {
          html += '<p><strong>Comment:</strong> ' + submission.comment + '</p>';
        }
        if (artifacts.completedAt) {
          html += '<p><strong>Completed:</strong> ' + new Date(artifacts.completedAt).toLocaleString() + '</p>';
        }
        html += '</div></div></div>';

        // Answer breakdown table
        if (artifacts.answers) {
          html += '<div class="card">';
          html += '<h2>Answer Breakdown</h2>';
          html += '<table class="answers-table">';
          html += '<tr><th>#</th><th>Question</th><th>Student Answer</th><th>Correct Answer</th><th>Result</th></tr>';

          var qKeys = Object.keys(artifacts.answers).sort();
          for (var i = 0; i < qKeys.length; i++) {
            var key = qKeys[i];
            var ans = artifacts.answers[key];
            var qLabel = questionLabels[key] || key;
            var opts = optionLabels[key] || {};
            var studentLabel = opts[ans.selected] || ans.selected || '(no answer)';
            var correctLabel = opts[ans.correct] || ans.correct;
            var resultClass = ans.isCorrect ? 'correct' : 'incorrect';
            var resultText = ans.isCorrect ? 'Correct' : 'Incorrect';

            html += '<tr>';
            html += '<td>' + (i + 1) + '</td>';
            html += '<td>' + qLabel + '</td>';
            html += '<td>' + studentLabel + '</td>';
            html += '<td>' + correctLabel + '</td>';
            html += '<td class="' + resultClass + '">' + resultText + '</td>';
            html += '</tr>';
          }

          html += '</table></div>';
        }

        contentEl.innerHTML = html;
        Zest.setHeight(document.body.scrollHeight + 40);
      });

      log('Waiting for context and submission data...');
    })();
  </script>
</body>
</html>
